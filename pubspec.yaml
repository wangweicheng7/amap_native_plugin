name: amap_native_plugin
description: Flutter plugin for native AMap views with pins, polylines, and circle geofences on Android, iOS and HarmonyOS.
version: 0.1.4
homepage: https://pub.dev/packages/amap_native_plugin
repository: https://github.com/wangweicheng7/amap_native_plugin/tree/adapt/amap-0.1.3-ohos-core
issue_tracker: https://github.com/wangweicheng7/amap_native_plugin/issues
topics:
  - amap
  - map
  - geofence
  - location

environment:
  sdk: ^3.12.2
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  plugin_platform_interface: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.origin.amap_native_plugin
        pluginClass: AmapNativePlugin
      ios:
        pluginClass: AmapNativePlugin
      ohos:
        package: com.origin.amap_native_plugin
        pluginClass: AmapNativePlugin
        dartPluginClass: AmapOhosPlugin
        dartFileName: src/ohos/amap_ohos.dart
